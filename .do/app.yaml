# DigitalOcean App Platform şartnamesi
# Kullanım: DigitalOcean → Apps → Create App → GitHub: ademtkn/lineclass (main)
# veya: doctl apps create --spec .do/app.yaml
name: lineclass
region: fra            # Frankfurt: Kırgızistan'a en yakın DO bölgelerinden
domains:
  - domain: lineclass.com.kg
    type: PRIMARY
  - domain: www.lineclass.com.kg
    type: ALIAS
services:
  - name: web
    github:
      repo: ademtkn/lineclass
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    run_command: npm start -- -p 8080
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /login
    envs:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://lineclass.com.kg
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: CHANGE_ME          # Supabase → Project Settings → API → Project URL
        scope: RUN_AND_BUILD_TIME
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: CHANGE_ME          # anon / publishable anahtar
        scope: RUN_AND_BUILD_TIME
      - key: SUPABASE_SERVICE_ROLE_KEY
        type: SECRET
        value: CHANGE_ME          # service_role / secret anahtar (gizli)
        scope: RUN_TIME
      - key: NEXT_PUBLIC_TIME_ZONE
        value: Asia/Bishkek
        scope: RUN_AND_BUILD_TIME
      - key: OPENAI_API_KEY      # isteğe bağlı: gerçek çeviri için
        type: SECRET
        value: ""
        scope: RUN_TIME
